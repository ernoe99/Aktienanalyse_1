# Streamlit-Konfiguration (lokal und Streamlit Community Cloud)

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1565c0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"

[client]
toolbarMode = "viewer"
